<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CHECKLIST FINAL DO ANO - GRUPO FIZZ</title>
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Checklist final de ano do Grupo Fizz, sincronizado com Google Sheets." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="top-row">
        <div>
          <div class="eyebrow">Grupo Fizz · Rosamango</div>
          <h1>CHECKLIST FINAL DO ANO - GRUPO FIZZ</h1>
          <p class="subtitle">Planejamento colaborativo — editável ao vivo, sincronizado com Google Sheets.</p>
        </div>
        <div class="sync-pill"><span class="sync-dot loading" id="sync-dot"></span><span id="sync-label">conectando…</span></div>
      </div>
      <div class="progress-overall">
        <div class="bar"><div class="fill" id="overall-fill" style="width: 0%"></div></div>
        <div class="progress-label"><span id="overall-label">0 de 0 itens concluídos</span><span id="overall-pct">0%</span></div>
      </div>
    </header>

    <div class="off-banner" id="estado-erro" hidden></div>

    <div class="filters" id="filtros">
      <button class="filter-chip" data-filtro="todas" data-active="true">Todos</button>
      <button class="filter-chip" data-filtro="Natal"><span class="dot" style="background: var(--red)"></span>Natal</button>
      <button class="filter-chip" data-filtro="Black Friday"><span class="dot" style="background: var(--bf-bg); border: 1px solid var(--border)"></span>Black Friday</button>
      <button class="filter-chip" data-filtro="Ano Novo"><span class="dot" style="background: var(--ny-fg)"></span>Ano Novo</button>
      <button class="filter-chip" data-filtro="Geral"><span class="dot" style="background: var(--geral-fg)"></span>Geral</button>
    </div>

    <div id="board"></div>

    <form id="nova-secao" class="add-section-form">
      <input type="text" id="campo-texto" placeholder="Nova seção…" maxlength="120" />
      <button type="submit" id="botao-adicionar">+ Seção</button>
    </form>

    <footer>Toque no ✓ pra concluir, no texto pra editar, na etiqueta colorida pra trocar a campanha.</footer>
  </div>

  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
